name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate lifetime GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error

          USERNAME = "sharky-3"
          TOKEN = os.environ["GH_TOKEN"]

          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "github-stats"
          }


          # ==========================================================
          # GITHUB API
          # ==========================================================

          def api(url):
              for attempt in range(10):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers=HEADERS
                      )

                      with urllib.request.urlopen(request) as response:

                          # GitHub may return 202 while statistics
                          # are still being generated.
                          if response.status == 202:
                              print(
                                  "GitHub is calculating statistics..."
                              )
                              time.sleep(10)
                              continue

                          return json.loads(
                              response.read().decode("utf-8")
                          )

                  except urllib.error.HTTPError as error:

                      if error.code == 202:
                          print(
                              "GitHub returned 202. Waiting..."
                          )
                          time.sleep(10)
                          continue

                      print(
                          f"HTTP {error.code}: {url}"
                      )

                      try:
                          body = error.read().decode(
                              "utf-8",
                              errors="replace"
                          )
                          print(body)
                      except Exception:
                          pass

                      return None

                  except urllib.error.URLError as error:
                      print(
                          f"Network error: {error}"
                      )
                      time.sleep(5)

              print(
                  f"Failed after retries: {url}"
              )

              return None


          # ==========================================================
          # USER
          # ==========================================================

          print("Fetching user information...")

          user = api(
              f"https://api.github.com/users/{USERNAME}"
          )

          if not user:
              raise Exception(
                  "Could not get user information."
              )

          followers = user.get(
              "followers",
              0
          )


          # ==========================================================
          # REPOSITORIES
          # ==========================================================

          print("Fetching repositories...")

          repos = []

          page = 1

          while True:

              data = api(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if data is None:
                  raise Exception(
                      f"Could not retrieve repositories page {page}."
                  )

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1


          # Only count repositories owned by the user.
          # Forks are excluded.
          original_repos = [
              repo
              for repo in repos
              if not repo.get("fork", False)
          ]

          repo_count = len(original_repos)


          # ==========================================================
          # STARS
          # ==========================================================

          stars = sum(
              repo.get(
                  "stargazers_count",
                  0
              )
              for repo in original_repos
          )


          # ==========================================================
          # COMMITS / ADDITIONS / DELETIONS
          # ==========================================================

          total_commits = 0
          total_additions = 0
          total_deletions = 0


          for repo in original_repos:

              owner = repo["owner"]["login"]
              name = repo["name"]

              print("")
              print(
                  f"Processing: {owner}/{name}"
              )

              url = (
                  f"https://api.github.com/repos/"
                  f"{owner}/{name}/stats/contributors"
              )

              contributors = api(url)

              if not contributors:

                  print(
                      "No contributor statistics available."
                  )

                  continue


              found = False


              for contributor in contributors:

                  author = contributor.get(
                      "author"
                  )

                  if not author:
                      continue


                  login = author.get(
                      "login",
                      ""
                  )


                  if login.lower() != USERNAME.lower():
                      continue


                  found = True


                  # Total commits.
                  total_commits += contributor.get(
                      "total",
                      0
                  )


                  # Weekly additions/deletions.
                  for week in contributor.get(
                      "weeks",
                      []
                  ):

                      total_additions += week.get(
                          "a",
                          0
                      )

                      total_deletions += week.get(
                          "d",
                          0
                      )


                  break


              if not found:

                  print(
                      "User is not listed as a contributor."
                  )


          # ==========================================================
          # NET LINES
          # ==========================================================

          net_lines = (
              total_additions -
              total_deletions
          )


          # ==========================================================
          # NUMBER FORMAT
          # ==========================================================

          def fmt(number):
              return f"{number:,}"


          # ==========================================================
          # BUILD README OUTPUT
          # ==========================================================

          stats = (
              "```swift\n\n"

              "kolarič@*blaž* "
              "------------------------------------------------------------------ --\n\n"

              ". OS: "
              "............................................................. "
              "Macbook pro M5\n\n"

              ". Uptime: "
              "............................................ "
              "19 years, 5 months, 29 days\n\n"

              ". Kernel: "
              ".................................................................. "
              "macOS\n\n"

              ". IDE: "
              "............................................................. "
              "Cursor, Xcode\n\n"

              ".\n\n"

              ". Languages.Programming: "
              "............... "
              "Java, Python, JavaScript, C#, Swift, Luau\n\n"

              ". Languages.Computer: "
              "............................................ "
              "HTML, CSS, JSON\n\n"

              ". Languages.Real: "
              "............................................. "
              "English, Slovenian\n\n"

              ".\n\n"

              ". Hobbies.Software: "
              ".................. "
              "macOS App & Widget Dev, Reverse Engineering\n\n"

              ". Hobbies.Web: "
              "........................... "
              "Web Scraping, Browser Extensions & Mods\n\n"

              ". Hobbies.Gaming: "
              "....................... "
              "Game Automation, Modding & Interactivity\n\n"

              "Contact "
              "----------------------------------------------------------------------- --\n\n"

              ". Discord: "
              "............................................................ "
              "sharky4160\n\n"

              "Stats "
              "------------------------------------------------------------------------- --\n\n"

              f". Repos: "
              f"............................... "
              f"{fmt(repo_count)} | "

              f"Stars: "
              f"........................... "
              f"{fmt(stars)}\n\n"

              f". Commits: "
              f"............................ "
              f"{fmt(total_commits)} | "

              f"Followers: "
              f"....................... "
              f"{fmt(followers)}\n\n"

              f". Lines of Code on GitHub: "
              f"{fmt(net_lines)} "
              f"( {fmt(total_additions)}++, "
              f"{fmt(total_deletions)}-- )\n\n"

              "```"
          )


          # ==========================================================
          # PRINT STATS
          # ==========================================================

          print("")
          print(
              "========================================"
          )
          print(
              "LIFETIME GITHUB STATS"
          )
          print(
              "========================================"
          )

          print(stats)

          print(
              "========================================"
          )


          # ==========================================================
          # UPDATE README
          # ==========================================================

          print("")
          print("Updating README.md...")


          with open(
              "README.md",
              "r",
              encoding="utf-8"
          ) as file:

              readme = file.read()


          pattern = re.compile(
              r"<!-- GITHUB_STATS_START -->"
              r".*?"
              r"<!-- GITHUB_STATS_END -->",
              re.DOTALL
          )


          replacement = (
              "<!-- GITHUB_STATS_START -->\n\n"
              f"{stats}\n\n"
              "<!-- GITHUB_STATS_END -->"
          )


          new_readme, replacements = pattern.subn(
              replacement,
              readme,
              count=1
          )


          if replacements == 0:

              raise Exception(
                  "Could not find "
                  "GITHUB_STATS_START/END markers "
                  "in README.md."
              )


          if new_readme == readme:

              print(
                  "README is already up to date."
              )

          else:

              with open(
                  "README.md",
                  "w",
                  encoding="utf-8"
              ) as file:

                  file.write(new_readme)

              print(
                  "README updated."
              )


          # ==========================================================
          # FINAL SUMMARY
          # ==========================================================

          print("")
          print(
              "========================================"
          )
          print(
              "SUMMARY"
          )
          print(
              "========================================"
          )

          print(
              f"Repositories : {fmt(repo_count)}"
          )

          print(
              f"Stars        : {fmt(stars)}"
          )

          print(
              f"Commits      : {fmt(total_commits)}"
          )

          print(
              f"Followers    : {fmt(followers)}"
          )

          print(
              f"Additions    : {fmt(total_additions)}"
          )

          print(
              f"Deletions    : {fmt(total_deletions)}"
          )

          print(
              f"Net LOC      : {fmt(net_lines)}"
          )

          print(
              "========================================"
          )

          PY


      # ============================================================
      # COMMIT README
      # ============================================================

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi