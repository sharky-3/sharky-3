name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate lifetime GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error

          USERNAME = "sharky-3"
          TOKEN = os.environ["GH_TOKEN"]

          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "github-stats"
          }

          def api(url):
              for attempt in range(10):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers=HEADERS
                      )

                      with urllib.request.urlopen(request) as response:

                          # GitHub is still calculating statistics.
                          if response.status == 202:
                              print("GitHub is calculating statistics...")
                              time.sleep(10)
                              continue

                          return json.loads(response.read())

                  except urllib.error.HTTPError as e:

                      if e.code == 202:
                          print("GitHub returned 202. Waiting...")
                          time.sleep(10)
                          continue

                      print(f"HTTP {e.code}: {url}")
                      return None

              print(f"Failed after retries: {url}")
              return None


          # ==========================================================
          # USER
          # ==========================================================

          user = api(
              f"https://api.github.com/users/{USERNAME}"
          )

          if not user:
              raise Exception("Could not get user information.")

          followers = user["followers"]


          # ==========================================================
          # REPOSITORIES
          # ==========================================================

          repos = []
          page = 1

          while True:

              data = api(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1


          repo_count = len(repos)

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repos
          )


          # ==========================================================
          # LIFETIME COMMITS / LOC
          # ==========================================================

          total_commits = 0
          total_additions = 0
          total_deletions = 0

          for repo in repos:

              owner = repo["owner"]["login"]
              name = repo["name"]

              print("")
              print(f"Processing: {owner}/{name}")

              url = (
                  f"https://api.github.com/repos/"
                  f"{owner}/{name}/stats/contributors"
              )

              contributors = api(url)

              if not contributors:
                  print("No contributor statistics available.")
                  continue

              found = False

              for contributor in contributors:

                  author = contributor.get("author")

                  if not author:
                      continue

                  login = author.get("login", "")

                  if login.lower() != USERNAME.lower():
                      continue

                  found = True

                  # Lifetime commit count for this repository.
                  total_commits += contributor.get("total", 0)

                  # Every week from the beginning of the
                  # repository's available statistics.
                  for week in contributor.get("weeks", []):

                      total_additions += week.get("a", 0)
                      total_deletions += week.get("d", 0)

                  break

              if not found:
                  print("User is not listed as a contributor.")


          # ==========================================================
          # NET LINES
          # ==========================================================

          net_lines = (
              total_additions -
              total_deletions
          )


          # ==========================================================
          # FORMAT
          # ==========================================================

          def fmt(number):
              return f"{number:,}"


          stats = (
              f". Repos: ............................... "
              f"{fmt(repo_count)} | "
              f"Stars: ........................... "
              f"{fmt(stars)}\n\n"

              f". Commits: ............................ "
              f"{fmt(total_commits)} | "
              f"Followers: ....................... "
              f"{fmt(followers)}\n\n"

              f". Lines of Code on GitHub: "
              f"{fmt(net_lines)} "
              f"( {fmt(total_additions)}++, "
              f"{fmt(total_deletions)}-- )"
          )


          print("")
          print("========================================")
          print("LIFETIME GITHUB STATS")
          print("========================================")
          print(stats)
          print("========================================")


          # ==========================================================
          # UPDATE README
          # ==========================================================

          with open(
              "README.md",
              "r",
              encoding="utf-8"
          ) as file:

              readme = file.read()


          pattern = (
              r"<!-- GITHUB_STATS_START -->"
              r".*?"
              r"<!-- GITHUB_STATS_END -->"
          )


          replacement = (
              "<!-- GITHUB_STATS_START -->\n"
              + stats +
              "\n<!-- GITHUB_STATS_END -->"
          )


          new_readme = re.sub(
              pattern,
              replacement,
              readme,
              flags=re.DOTALL
          )


          if new_readme == readme:

              print("README is already up to date.")

          else:

              with open(
                  "README.md",
                  "w",
                  encoding="utf-8"
              ) as file:

                  file.write(new_readme)

              print("README updated.")


          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi